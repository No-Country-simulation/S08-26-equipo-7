services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serviceflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-serviceflow_dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serviceflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/serviceflow_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-serviceflow_dev}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Definir ADMIN_PASSWORD_HASH en el .env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en el .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: